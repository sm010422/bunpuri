# 영속화 없음: 재시작하면 아직 DB에 반영 안 된 분노 증분(최대 flush 주기 5초분)과 오늘 랭킹이 사라진다.
# 랭킹은 rage_count 테이블에서 다시 만들 수 있고, 증분 유실은 허용 범위로 둔다.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: bunpuri-redis
spec:
  selector:
    app: bunpuri-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bunpuri-redis
  template:
    metadata:
      labels:
        app: bunpuri-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker2
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi

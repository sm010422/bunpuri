# NodePort만 열고 Ingress는 두지 않는다: Traefik :80은 Tailscale Funnel로 인터넷에 공개되므로,
# 인증·요청 제한이 없는 지금은 tailnet 안(노드 IP:30880)에서만 접근한다.
apiVersion: v1
kind: Service
metadata:
  name: bunpuri
  labels:
    app: bunpuri
spec:
  type: NodePort
  selector:
    app: bunpuri
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunpuri
  labels:
    app: bunpuri
spec:
  replicas: 1
  # worker2 메모리로는 새 파드(512Mi)를 하나 더 띄울 여유가 없어, 롤링 대신 Recreate로 교체한다.
  # 배포 중 수십 초 중단을 감수하는 선택 (메모리 확보 후 RollingUpdate로 되돌릴 것).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bunpuri
  template:
    metadata:
      labels:
        app: bunpuri
    spec:
      # Service "redis"가 자동 주입하는 REDIS_PORT=tcp://...가 application.yml의 ${REDIS_PORT}와 겹쳐
      # 포트 바인딩이 실패했다 (2026-11-16 첫 배포 CrashLoopBackOff). 서비스 링크 환경변수를 끈다.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-worker2
      containers:
        - name: app
          image: sm010422/bunpuri # tag set by kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/bunpuri
            - name: DB_USER
              value: bunpuri
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bunpuri-db
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis
            # 로드맵 4-JVM: 512Mi limit 안에서 힙 60%, 나머지는 메타스페이스·스레드 스택·코드 캐시 몫.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 512Mi
